[workspace]
resolver = "2"

members = [
    "crates/connexa-core",
    "crates/connexa-protocol",
    "crates/connexa-signaling",
    "crates/connexa-security",
    "crates/connexa-agent",
    "crates/connexa-sfu",
    "apps/signaling-server",
    "apps/desktop"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Connexa"]

[workspace.dependencies]
connexa-core = { path = "crates/connexa-core" }
connexa-protocol = { path = "crates/connexa-protocol" }
connexa-security = { path = "crates/connexa-security" }
connexa-signaling = { path = "crates/connexa-signaling" }
connexa-agent = { path = "crates/connexa-agent" }
connexa-sfu = { path = "crates/connexa-sfu" }
signaling-server = { path = "apps/signaling-server" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dashmap = "6"
getrandom = "0.3"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tokio-tungstenite = "0.26"
