name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (server + libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop app needs WebView2 (Windows); it is built in the windows job.
      - run: cargo clippy --workspace --exclude connexa-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude connexa-desktop

  clients:
    name: Web client + extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: connexa-chrome-extension
          path: clients/chrome-extension/dist

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - name: Bundle web client into the app
        working-directory: clients
        run: npm ci && npm run build:android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p clients/android assembleDebug --no-daemon
      - run: mv clients/android/app/build/outputs/apk/debug/app-debug.apk Connexa-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: connexa-android-apk
          path: Connexa-android.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build clients
        working-directory: clients
        run: npm ci && npm run build:desktop
      - run: cargo test -p connexa-agent -p connexa-desktop
      - name: Build installer
        working-directory: apps/desktop
        run: npx --prefix ../../clients tauri build
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/Connexa.exe out/Connexa.exe
          Copy-Item target/release/bundle/nsis/*.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: connexa-windows
          path: out/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, clients, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: cd artifacts/connexa-chrome-extension && zip -r ../../Connexa-chrome-extension.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/connexa-windows/*.exe
            artifacts/connexa-android-apk/Connexa-android.apk
            Connexa-chrome-extension.zip
