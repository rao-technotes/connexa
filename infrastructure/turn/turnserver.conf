# coturn configuration for Connexa.
# The secret, realm and external IP are passed on the command line by docker-compose.

listening-port=3478
min-port=49160
max-port=49200

# Time-limited credentials minted by the signaling server (TURN REST API scheme).
use-auth-secret
fingerprint

# Only relay media; never let clients reach private networks through the relay.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse limits.
user-quota=12
total-quota=1200
max-bps=3000000

no-cli
no-tlsv1
no-tlsv1_1
log-file=stdout
simple-log
