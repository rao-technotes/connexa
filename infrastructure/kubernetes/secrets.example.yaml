# Not applied by kustomize. Copy, fill in, and apply once:
#   kubectl -n connexa apply -f secrets.yaml
# (or create it from a secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: connexa
  namespace: connexa
type: Opaque
stringData:
  postgres-password: change-me
  database-url: postgres://connexa:change-me@postgres:5432/connexa
  turn-secret: change-me
  metrics-token: change-me
